<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1350px;
    background: #0a0a0a;
    position: relative;
  }
  .wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 820px;
    text-align: center;
  }
  .line {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.35;
    color: #f2f2f0;
    letter-spacing: 0.5px;
  }
  .rule {
    width: 60px;
    height: 1px;
    background: #555;
    margin: 40px auto;
  }
  .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 26px;
    color: #8a8a86;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line">You can be scaling<br>and still feel completely alone.</div>
    <div class="rule"></div>
    <div class="sub">The Connector Club</div>
  </div>
</body>
</html>
